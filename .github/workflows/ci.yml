# Схема:
#   push в ЛЮБУЮ ветку / PR в master -> lint, unit (+ api, e2e — только master)
#     стартуют ПАРАЛЛЕЛЬНО, без needs между собой.
#     Падение одной джобы остальные не останавливает.
#   после тестовых джоб -> report: собирает Allure-отчёт и публикует на GitHub Pages.
#     Перед первым запуском: Settings → Pages → Source: GitHub Actions.
#   вручную (Run workflow) -> только k6 (3 сценария на выбор).

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      k6-script:
        description: "k6-сценарий из tests/k6/"
        type: choice
        required: true
        default: smoke.js
        options:
          - smoke.js
          - load.js
          - spike.js

jobs:
  lint:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            tests/package-lock.json

      - name: Backend lint
        working-directory: backend
        run: |
          npm i
          npm run lint

      - name: Frontend lint
        working-directory: frontend
        run: |
          npm i
          npm run lint

      - name: Tests lint
        working-directory: tests
        run: |
          npm i
          npm run lint
          npm run lint:types

  unit:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - working-directory: tests
        run: npm i

      - name: Unit tests with coverage
        working-directory: tests
        # Пороги — в jest.config.ts (branches 70, остальное 80):
        # ниже порога джоба краснеет.
        run: npm run test:unit -- --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: tests/coverage/
          retention-days: 30

      - name: Upload Allure results (unit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-unit
          path: tests/allure-results/
          retention-days: 7

  api:
    # Только master и не ручной запуск. needs нет — параллельный старт.
    if: github.ref == 'refs/heads/master' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - working-directory: tests
        run: npm i

      - name: API tests
        working-directory: tests
        run: npm run test:api

      - name: Upload Allure results (api)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-api
          path: tests/allure-results/
          retention-days: 7

  e2e:
    # Только master и не ручной запуск. needs нет — параллельный старт.
    if: github.ref == 'refs/heads/master' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - working-directory: tests
        run: npm i

      - name: Install Playwright browsers
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        working-directory: tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/playwright-report/
            tests/test-results/
          retention-days: 30

      - name: Upload Allure results (e2e)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-e2e
          path: tests/allure-results/
          retention-days: 7

  # Сборка единого Allure-отчёта из результатов всех тестовых джоб
  # и публикация на GitHub Pages. Ждёт завершения всех (needs),
  # но always() — публикует даже частично (упавшие тесты в отчёте видны).
  report:
    needs: [lint, unit, api, e2e]
    if: always() && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Деплои на Pages — строго по очереди, иначе два пуша подряд
    # могут перезаписать друг друга.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Частей может не быть (все джобы скипнуты/упали до прогона тестов).
      # Сначала проверяем наличие, иначе download с pattern упадёт.
      - name: Check for Allure artifacts
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner, repo: context.repo.repo,
              run_id: context.runId,
            });
            core.setOutput('found', data.artifacts.some(a => a.name.startsWith('allure-')) ? 'yes' : 'no');

      - name: Download Allure results
        if: steps.check.outputs.found == 'yes'
        uses: actions/download-artifact@v4
        with:
          pattern: allure-*
          path: parts
        continue-on-error: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Allure HTML
        run: |
          shopt -s nullglob
          parts=(parts/*/)
          mkdir -p _site
          if [ ${#parts[@]} -eq 0 ]; then
            echo '<h1>CI: в этом запуске нет Allure-результатов (джобы скипнуты)</h1>' > _site/index.html
          else
            npx -y allure-commandline generate "${parts[@]}" -o _site --clean
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  k6:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 scenario
        working-directory: tests/k6
        run: k6 run ${{ inputs.k6-script }}

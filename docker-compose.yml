services:
  postgres:
    image: postgres:16-alpine
    container_name: qa-sandbox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: qa
      POSTGRES_PASSWORD: qa
      POSTGRES_DB: qa_sandbox
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - qa-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa -d qa_sandbox"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qa-sandbox-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      # Внутри compose-стеи имя хоста = имя сервиса (postgres)
      DATABASE_URL: postgresql://qa:qa@postgres:5432/qa_sandbox?schema=public
      # Искусственная задержка GET /api/cart (для тренировки waits/spinners), мс
      CART_DELAY_MS: 1500
    ports:
      - "4000:4000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
    networks:
      - qa-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:4000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: qa-sandbox-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Фронт ходит относительным путём (baseURL = ''), запросы на /api
      # проксирует сам Vite в бэк-контейнер (см. vite.config.ts).
      # VITE_API_URL намеренно НЕ задаём: захардкоженный localhost:4000
      # вшился бы в бандл и сломал бы доступ с любого адреса, кроме localhost.
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
    networks:
      - qa-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  qa-net:
    driver: bridge

volumes:
  pgdata:
